name: Publish to npm

# Publishes @kerusiweb/core, @kerusiweb/angular and @kerusiweb/react when a
# version tag is pushed: `git tag v2.4.0 && git push origin v2.4.0`.
# The tag must match the version in all three package.json files, which the
# release PR bumps beforehand. Once the packages are out it also creates the
# GitHub Release from the CHANGELOG.md section. See "Releasing" in CONTRIBUTING.md.

on:
  push:
    tags: ['v*.*.*']

# One publish at a time, and never cancel one half-way through.
concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read
  # Lets npm sign a provenance statement linking each package to this run.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships an older one.
      - run: npm install -g npm@11

      - name: Check the tag matches every package version
        run: |
          node -e '
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            const pkgs = ["core", "angular", "react"].map((p) => require(`./projects/${p}/package.json`));
            const wrong = pkgs.filter((p) => p.version !== tag);
            if (wrong.length) {
              for (const p of wrong) console.error(`${p.name} is ${p.version}, but the tag is v${tag}`);
              process.exit(1);
            }
            for (const p of pkgs.slice(1)) {
              const peer = p.peerDependencies["@kerusiweb/core"];
              if (peer !== `^${tag}`) {
                console.error(`${p.name} needs @kerusiweb/core "${peer}"; expected "^${tag}"`);
                process.exit(1);
              }
            }
            console.log(`All three packages are ${tag}.`);
          '

      - run: npm ci
      - run: npm run build:core
      - run: npm run test:ci
      - run: npm run build:angular
      - run: npm run build:react

      # Core first: both bindings need this version of it on the registry.
      # A version that is already published is skipped, so re-running a
      # workflow that failed part-way picks up where it stopped. No npm token
      # is used: npm exchanges this run's OIDC token for publish rights, as
      # configured on each package's "Trusted Publisher" settings.
      - name: Publish
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          publish() {
            name="$1"; dir="$2"
            if npm view "$name@${VERSION#v}" version >/dev/null 2>&1; then
              echo "$name@${VERSION#v} is already on npm; skipping."
            else
              npm publish "$dir" --provenance
            fi
          }
          publish @kerusiweb/core ./projects/core
          publish @kerusiweb/angular ./dist/angular
          publish @kerusiweb/react ./projects/react

  # Runs only after every package is published, so a Release is never announced
  # for a version that failed to reach npm. Re-running skips an existing one.
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the GitHub Release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
            exit 0
          fi
          version="${TAG#v}"
          awk -v h="## [$version]" 'index($0,h)==1{f=1;next} f&&/^## \[/{exit} f' CHANGELOG.md             | sed '1{/^$/d}' > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG.md section for $version; add one before tagging." >&2
            exit 1
          fi
          gh release create "$TAG" --title "kerusiweb $version" --notes-file notes.md --verify-tag
