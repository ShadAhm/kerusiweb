<svg
  xmlns="http://www.w3.org/2000/svg"
  class="kerusi-section-svg"
  role="presentation"
  focusable="false"
  [style.--kerusi-focus-ring-input]="colors().focusRing"
  [attr.viewBox]="viewBox()"
  [style.max-width.px]="naturalWidth()"
  preserveAspectRatio="xMidYMid meet"
>
  <rect
    x="0"
    y="0"
    [attr.width]="layout().width"
    [attr.height]="layout().height"
    [style.fill]="backdrop()"
  />

  <!-- Elements first, so a screen or stage sits behind the seats it faces. -->
  @for (placed of layout().elements; track placed.element.id) {
    @if (drawsElement(placed)) {
      <g
        class="kerusi-element kerusi-element--{{ placed.element.kind }}"
        [attr.transform]="transform(placed)"
      >
        @switch (style(placed).shape) {
          @case ('screen') {
            <path [attr.d]="screenPathOf(placed)" [style.fill]="elementFillOf(placed)" />
          }
          @case ('text') {}
          @case ('void') {
            <rect
              class="kerusi-element__void"
              [attr.x]="placed.x"
              [attr.y]="placed.y"
              [attr.width]="placed.width"
              [attr.height]="placed.height"
              [style.stroke]="elementTextFillOf(placed)"
              fill="none"
            />
          }
          @default {
            <rect
              [attr.x]="placed.x"
              [attr.y]="placed.y"
              [attr.width]="placed.width"
              [attr.height]="placed.height"
              [attr.rx]="radiusOf(placed)"
              [style.fill]="elementFillOf(placed)"
            />
          }
        }
        @if (placed.element.label && style(placed).showLabel) {
          <text
            class="kerusi-element__label"
            text-anchor="middle"
            dominant-baseline="central"
            [attr.x]="placed.centerX"
            [attr.y]="placed.centerY"
            [attr.font-size]="placed.fontSize"
            [style.fill]="elementTextFillOf(placed)"
            [attr.transform]="labelTransform(placed)"
          >
            {{ placed.element.label }}
          </text>
        }
      </g>
    }
  }

  @for (entry of seats(); track entry.placed.seat.id) {
    @let placed = entry.placed;
    @let glyph = entry.glyph;
    <g
      [class]="glyph.className"
      role="button"
      [attr.tabindex]="tabIndex(placed)"
      [attr.aria-label]="ariaLabel(placed)"
      [attr.aria-pressed]="entry.selected"
      [attr.aria-disabled]="!placed.seat.selectable"
      [attr.data-seat-id]="placed.seat.id"
      [attr.transform]="transform(placed)"
      (click)="onSeatClick(placed)"
      (focus)="onSeatFocus(placed)"
      (keydown)="onKeydown($event)"
    >
      <!-- Tapered toward the back, square at the front, so which way the seat
           faces is legible from the outline alone. -->
      <path class="kerusi-seat__box" [attr.d]="glyph.body.d" [style.fill]="glyph.body.fill" />
      @if (glyph.wash; as wash) {
        <!-- Colour stays the seat type's; a taken seat recedes under a wash
             instead, so the type colour still reads on a busy map. -->
        <path class="kerusi-seat__wash" [attr.d]="wash.d" [style.fill]="wash.fill" />
      }
      @if (glyph.core; as core) {
        <!-- Selection is the one state drawn from two tones: the body above is
             the frame, this is the bright core inside it. Whichever way the
             host page is themed, one of the two separates from it — which is
             why nothing here has to know about the page. -->
        <path class="kerusi-seat__core" [attr.d]="core.d" [style.fill]="core.fill" />
      }
      @if (glyph.occupant; as occupant) {
        <!-- Deliberately not counter-rotated: the occupant leans with the
             seat. Solid = settled (yours, or sold); hollow = a hold still in
             progress. -->
        <path
          class="kerusi-seat__occupant kerusi-seat__occupant--{{ occupant.variant }}"
          [attr.d]="occupant.d"
          [attr.stroke-width]="occupant.strokeWidth"
          [style.fill]="occupant.fill"
          [style.stroke]="occupant.stroke"
        />
      }
      <!-- The halo colour and width are bound here rather than in the
           stylesheet: a CSS `var(--kerusi-selected-fg, …)` rule would carry
           the library default as its fallback and skip the [colors] tier. -->
      <text
        class="kerusi-seat__label"
        text-anchor="middle"
        dominant-baseline="central"
        [attr.x]="glyph.label.x"
        [attr.y]="glyph.label.y"
        [attr.font-size]="glyph.label.fontSize"
        [style.fill]="glyph.label.fill"
        [style.stroke]="glyph.label.halo"
        [attr.stroke-width]="glyph.label.haloWidth"
        [attr.transform]="glyph.label.transform"
      >
        {{ glyph.label.text }}
      </text>
      @if (glyph.wheelchair; as wheelchair) {
        <!-- A corner marker, not a different fill: availability owns the fill. -->
        <circle
          class="kerusi-seat__wheelchair"
          [attr.cx]="wheelchair.cx"
          [attr.cy]="wheelchair.cy"
          [attr.r]="wheelchair.r"
          [style.fill]="wheelchair.fill"
        />
      }
    </g>
  }
</svg>
